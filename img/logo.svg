<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Card background -->
  <rect width="36" height="36" rx="7" fill="#03979d"/>
  <!-- Chip body -->
  <rect x="9" y="9" width="18" height="18" rx="3" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Top pins -->
  <line x1="13" y1="9" x2="13" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="9" x2="23" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom pins -->
  <line x1="13" y1="27" x2="13" y2="31" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="27" x2="23" y2="31" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left pins -->
  <line x1="9" y1="13" x2="5" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="23" x2="5" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right pins -->
  <line x1="27" y1="13" x2="31" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="23" x2="31" y2="23" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center node -->
  <circle cx="18" cy="18" r="3" fill="white"/>
  <!-- Inner cross connections -->
  <line x1="18" y1="15" x2="18" y2="12" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <line x1="18" y1="21" x2="18" y2="24" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <line x1="15" y1="18" x2="12" y2="18" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <line x1="21" y1="18" x2="24" y2="18" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
</svg>
